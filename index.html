<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🦫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,300..900&family=DotGothic16&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="progress" aria-hidden="true"><i></i></div>
<main id="top">
  <section class="hero" aria-label="Intro">
    <div class="hero-stage">
      <canvas id="beaver" aria-hidden="true"></canvas>

      <h1 id="heroTitle" style="margin:0">
        <span class="giant g1" aria-hidden="true"></span>
        <span class="giant g2" aria-hidden="true"></span>
      </h1>
      <a class="scroll-cue" href="#work" aria-label="Scroll to projects">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>
  </section>


  <section class="work wrap" id="work" aria-label="Projects">
    <h2 class="work-title">Projects</h2>
    <div class="work-carousel">
      <div class="work-track"></div>
    </div>
  </section>

  <section class="contact-sec wrap" id="contact" aria-label="Contact">
    <div class="contact-head">
      <h2 class="work-title">Contact</h2>
      <p class="contact-sub">If you do not like japanese cars or goth mommies, don't even try to reach out... -🦫 out ✌️</p>
    </div>
    <div class="contact-body">
      <div class="mail-card"></div>
      <ul class="tiles"></ul>
    </div>
  </section>

  <section class="bubble-sec" id="bubble" aria-label="Spinning beaver">
    <div class="magnet" id="magnet" role="img" aria-label="A spinning beaver you can click, grab and throw">
      <canvas class="spinner" aria-hidden="true"></canvas>
    </div>
  </section>
</main>

<!-- now playing on Spotify: a small widget pinned to the top of the screen, above everything -->
<aside class="np" aria-label="Now playing on Spotify" aria-live="polite">
  <div class="np-media" aria-hidden="true">
    <div class="np-disk"><span></span></div>
    <div class="np-art"></div>
  </div>
  <div class="np-info">
    <strong class="np-song">Nothing on</strong>
    <span class="np-artist"></span>
  </div>
</aside>


</body>
</html>
